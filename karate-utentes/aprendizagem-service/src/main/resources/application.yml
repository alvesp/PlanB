server:
  port: 8082

spring:
  application:
    name: aprendizagem-service
  datasource:
    url: jdbc:postgresql://localhost:5432/aprendizagem
    # Utilizador próprio desta base (ver docker/postgres/01-bases-de-dados.sh).
    username: ${APRENDIZAGEM_DB_USER:aprendizagem_app}
    password: ${APRENDIZAGEM_DB_PASSWORD:aprendizagem_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 10000
        linger.ms: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Um grupo novo lê o tópico compactado de alunos desde o início (réplica completa).
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

outbox:
  intervalo-ms: 500
  tamanho-lote: 100
  timeout-envio: PT30S
  retencao: P7D
  limpeza-cron: "0 40 3 * * *"

aprendizagem:
  fuso-horario: Europe/Lisbon
  kafka:
    grupo: aprendizagem-service
    particoes: 3
    replicas: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
